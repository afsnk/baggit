name: api-gateway
on:
  push:
    branches:
      - main
    paths:
      - packages/api/**
      # - packages/shared/**
  pull_request:
    branches:
      - main
    paths:
      - packages/api/**
      # - packages/shared/**

env:
  NODE_ENV: production

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploys API gateway for baggit service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run deploy:api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
